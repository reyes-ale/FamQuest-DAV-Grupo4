# FamQuest API

openapi: 3.0.3
info:
  title: FamQuest API
  version: 1.0.0
  description: |
    API REST de FamQuest: los padres asignan tareas y los hijos ganan puntos por completarlas y así canjear recompensas establecidas por los padres.
    Flujo de tareas: pendientes cuando se crean, el hijo la completa y pasa a revisión, el padre la aprueba o la rechaza y después se acuerdan las recompensas.

servers:
  - url: http://localhost:3000/famquest/v1

tags:
  - name: Sesión
  - name: Padres
  - name: Familias
  - name: Hijos
  - name: Tareas
  - name: Desafíos
  - name: Recompensas
  - name: Canjes
  - name: Niveles
  - name: Insignias
  - name: Avatar
  - name: Minijuegos
  - name: Progreso

paths:
  # Sesiones
  /sesiones:
    post:
      tags: [Sesión]
      summary: Iniciar sesión (padre o hijo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo: { type: string }
                contrasena: { type: string }
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401':
          description: Correo o contraseña incorrectos

  # Padres
  /padres:
    post:
      tags: [Padres]
      summary: Registrar un padre
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Padre' }
      responses:
        '201':
          description: Padre registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Padre' }
        '400':
          description: Datos inválidos

  /padres/{idPadre}:
    parameters:
      - $ref: '#/components/parameters/IdPadre'
    get:
      tags: [Padres]
      summary: Ver el perfil de un padre
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Padre' }
        '404':
          description: Padre no encontrado
    put:
      tags: [Padres]
      summary: Actualizar el perfil de un padre
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Padre' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Padre' }
        '404':
          description: Padre no encontrado

  # Familias
  /familias:
    post:
      tags: [Familias]
      summary: Crear una familia
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Familia' }
      responses:
        '201':
          description: Familia creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Familia' }

  /familias/{idFamilia}:
    get:
      tags: [Familias]
      summary: Ver una familia
      parameters:
        - $ref: '#/components/parameters/IdFamilia'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Familia' }
        '404':
          description: Familia no encontrada

  /familias/{idFamilia}/miembros:
    post:
      tags: [Familias]
      summary: Agregar un miembro a la familia
      parameters:
        - $ref: '#/components/parameters/IdFamilia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idUsuario: { type: integer, example: 4 }
      responses:
        '201':
          description: Miembro agregado
        '404':
          description: Familia o usuario no encontrado

  /familias/{idFamilia}/miembros/{idUsuario}:
    delete:
      tags: [Familias]
      summary: Eliminar un miembro de la familia
      parameters:
        - $ref: '#/components/parameters/IdFamilia'
        - $ref: '#/components/parameters/IdUsuario'
      responses:
        '204':
          description: Miembro eliminado
        '404':
          description: Familia o usuario no encontrado

  # Hijos
  /familias/{idFamilia}/hijos:
    parameters:
      - $ref: '#/components/parameters/IdFamilia'
    post:
      tags: [Hijos]
      summary: Crear el perfil de un hijo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Hijo' }
      responses:
        '201':
          description: Perfil creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hijo' }
        '400':
          description: Datos inválidos
    get:
      tags: [Hijos]
      summary: Listar los hijos de una familia
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Hijo' }

  /hijos/{idHijo}:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Hijos]
      summary: Ver el perfil de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hijo' }
        '404':
          description: Hijo no encontrado
    put:
      tags: [Hijos]
      summary: Editar el perfil de un hijo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Hijo' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hijo' }
        '404':
          description: Hijo no encontrado
    delete:
      tags: [Hijos]
      summary: Eliminar el perfil de un hijo
      responses:
        '204':
          description: Perfil eliminado
        '404':
          description: Hijo no encontrado

  # Tareas
  /hijos/{idHijo}/tareas:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    post:
      tags: [Tareas]
      summary: Asignar una tarea a un hijo
      description: La tarea se crea como pendiente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tarea' }
      responses:
        '201':
          description: Tarea asignada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarea' }
        '400':
          description: Datos inválidos
    get:
      tags: [Tareas]
      summary: Ver las tareas de un hijo
      parameters:
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoTarea' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tarea' }

  /tareas/{idTarea}:
    parameters:
      - $ref: '#/components/parameters/IdTarea'
    get:
      tags: [Tareas]
      summary: Ver una tarea
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarea' }
        '404':
          description: Tarea no encontrada
    put:
      tags: [Tareas]
      summary: Editar una tarea
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tarea' }
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarea' }
        '404':
          description: Tarea no encontrada
    patch:
      tags: [Tareas]
      summary: Cambiar el estado de una tarea (completada, aprobada o rechazada)
      description: |
        - El hijo la completa y pasa a revisión con evidencia.
        - El padre la aprueba y se le suman los puntos al hijo.
        - El padre la rechaza y coloca un comentario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { $ref: '#/components/schemas/EstadoTarea' }
                evidencia: { type: string }
                comentario: { type: string }
            examples:
              completar:
                summary: El hijo la completa
                value: { estado: EN_REVISION, evidencia: foto-platos.jpg }
              aprobar:
                summary: El padre la aprueba
                value: { estado: APROBADA }
              rechazar:
                summary: El padre la rechaza
                value: { estado: RECHAZADA, comentario: Faltó secar los vasos }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarea' }
        '404':
          description: Tarea no encontrada
    delete:
      tags: [Tareas]
      summary: Eliminar una tarea
      responses:
        '204':
          description: Tarea eliminada
        '404':
          description: Tarea no encontrada

  # Desafíos
  /hijos/{idHijo}/desafios:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    post:
      tags: [Desafíos]
      summary: Crear un desafío para un hijo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Desafio' }
      responses:
        '201':
          description: Desafío creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Desafio' }
        '400':
          description: Datos inválidos
    get:
      tags: [Desafíos]
      summary: Ver los desafíos de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Desafio' }

  /desafios/{idDesafio}:
    get:
      tags: [Desafíos]
      summary: Ver un desafío
      parameters:
        - $ref: '#/components/parameters/IdDesafio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Desafio' }
        '404':
          description: Desafío no encontrado

  # Recompensas
  /padres/{idPadre}/recompensas:
    parameters:
      - $ref: '#/components/parameters/IdPadre'
    post:
      tags: [Recompensas]
      summary: Crear una recompensa
      description: 'Padre.crearRecompensa(r). La recompensa se crea como disponible.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Recompensa' }
      responses:
        '201':
          description: Recompensa creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recompensa' }
        '400':
          description: Datos inválidos
        '404':
          description: Padre no encontrado
    get:
      tags: [Recompensas]
      summary: Ver las recompensas que creó un padre
      description: El hijo usa esta ruta para ver lo que puede canjear (?disponible=true).
      parameters:
        - name: disponible
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Recompensa' }

  /recompensas/{idRecompensa}:
    parameters:
      - $ref: '#/components/parameters/IdRecompensa'
    get:
      tags: [Recompensas]
      summary: Ver una recompensa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recompensa' }
        '404':
          description: Recompensa no encontrada
    put:
      tags: [Recompensas]
      summary: Editar una recompensa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Recompensa' }
      responses:
        '200':
          description: Recompensa actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recompensa' }
        '404':
          description: Recompensa no encontrada
    patch:
      tags: [Recompensas]
      summary: Activar o desactivar una recompensa
      description: 'Recompensa.activar() / Recompensa.desactivar()'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disponible: { type: boolean }
            examples:
              activar:
                summary: Activar
                value: { disponible: true }
              desactivar:
                summary: Desactivar
                value: { disponible: false }
      responses:
        '200':
          description: Recompensa actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recompensa' }
        '404':
          description: Recompensa no encontrada
    delete:
      tags: [Recompensas]
      summary: Eliminar una recompensa
      responses:
        '204':
          description: Recompensa eliminada
        '404':
          description: Recompensa no encontrada

  # Canjes
  /hijos/{idHijo}/canjes:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    post:
      tags: [Canjes]
      summary: Canjear una recompensa
      description: |
        Hijo.canjearRecompensa(r): Canje.
        Se descuentan los puntos al hijo y el canje queda como PENDIENTE_ENTREGA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idRecompensa: { type: integer, example: 1 }
      responses:
        '201':
          description: Canje realizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Canje' }
        '400':
          description: La recompensa no está disponible
        '404':
          description: Hijo o recompensa no encontrado
        '409':
          description: El hijo no tiene suficientes puntos
    get:
      tags: [Canjes]
      summary: Ver el historial de canjes de un hijo
      parameters:
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoCanje' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Canje' }

  /canjes/{idCanje}:
    parameters:
      - $ref: '#/components/parameters/IdCanje'
    get:
      tags: [Canjes]
      summary: Ver un canje
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Canje' }
        '404':
          description: Canje no encontrado
    patch:
      tags: [Canjes]
      summary: Confirmar la entrega de una recompensa
      description: 'Canje.confirmarEntrega(). El padre confirma que entregó la recompensa.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { $ref: '#/components/schemas/EstadoCanje' }
            example: { estado: ENTREGADO }
      responses:
        '200':
          description: Entrega confirmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Canje' }
        '404':
          description: Canje no encontrado
        '409':
          description: El canje ya fue entregado

  # Niveles
  /niveles:
    get:
      tags: [Niveles]
      summary: Lista de niveles y puntos requeridos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Nivel' }

  # Insignias
  /insignias:
    get:
      tags: [Insignias]
      summary: Catálogo de insignias
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Insignia' }

  /hijos/{idHijo}/insignias:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Insignias]
      summary: Insignias obtenidas por un hijo, con su fecha
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InsigniaObtenida' }
        '404':
          description: Hijo no encontrado

  # Avatar
  /hijos/{idHijo}/avatar:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Avatar]
      summary: Ver el avatar de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avatar' }
        '404':
          description: Hijo no encontrado
    put:
      tags: [Avatar]
      summary: Personalizar el avatar de un hijo (color y accesorios)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Avatar' }
      responses:
        '200':
          description: Avatar actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avatar' }
        '400':
          description: Datos inválidos
        '404':
          description: Hijo no encontrado

  # Minijuegos
  /minijuegos:
    get:
      tags: [Minijuegos]
      summary: Listar minijuegos según la edad
      parameters:
        - name: edad
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Minijuego' }
        '400':
          description: Edad inválida

  /minijuegos/{idMinijuego}:
    parameters:
      - $ref: '#/components/parameters/IdMinijuego'
    get:
      tags: [Minijuegos]
      summary: Ver un minijuego
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Minijuego' }
        '404':
          description: Minijuego no encontrado

  /minijuegos/{idMinijuego}/partidas:
    parameters:
      - $ref: '#/components/parameters/IdMinijuego'
    post:
      tags: [Minijuegos]
      summary: Registrar el resultado de una partida
      description: Devuelve la partida con la bonificación que ganó el hijo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idHijo: { type: integer, example: 5 }
                puntaje: { type: integer, example: 85 }
      responses:
        '201':
          description: Partida registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartidaMinijuego' }
        '400':
          description: Datos inválidos
        '404':
          description: Minijuego o hijo no encontrado

  /hijos/{idHijo}/partidas:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Minijuegos]
      summary: Historial de partidas de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PartidaMinijuego' }
        '404':
          description: Hijo no encontrado

  # Progreso
  /hijos/{idHijo}/progreso:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Progreso]
      summary: Consultar el progreso de un hijo (puntos, nivel, tareas e insignias)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hijo: { $ref: '#/components/schemas/Hijo' }
                  nivel: { $ref: '#/components/schemas/Nivel' }
                  tareas:
                    type: array
                    items: { $ref: '#/components/schemas/Tarea' }
                  insignias:
                    type: array
                    items: { $ref: '#/components/schemas/InsigniaObtenida' }
        '404':
          description: Hijo no encontrado

components:
  parameters:
    IdUsuario:
      name: idUsuario
      in: path
      required: true
      schema: { type: integer }
    IdPadre:
      name: idPadre
      in: path
      required: true
      schema: { type: integer }
    IdFamilia:
      name: idFamilia
      in: path
      required: true
      schema: { type: integer }
    IdHijo:
      name: idHijo
      in: path
      required: true
      schema: { type: integer }
    IdTarea:
      name: idTarea
      in: path
      required: true
      schema: { type: integer }
    IdDesafio:
      name: idDesafio
      in: path
      required: true
      schema: { type: integer }
    IdRecompensa:
      name: idRecompensa
      in: path
      required: true
      schema: { type: integer }
    IdCanje:
      name: idCanje
      in: path
      required: true
      schema: { type: integer }
    IdMinijuego:
      name: idMinijuego
      in: path
      required: true
      schema: { type: integer }

  schemas:
    # Padre e Hijo heredan de Usuario
    Usuario:
      type: object
      properties:
        idUsuario: { type: integer, readOnly: true }
        nombre: { type: string }
        correo: { type: string }
        contrasena: { type: string, writeOnly: true }
        fechaRegistro: { type: string, format: date, readOnly: true }

    Padre:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            telefono: { type: string }

    Hijo:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            fechaNacimiento: { type: string, format: date }
            puntosActuales: { type: integer }
            experiencia: { type: integer }

    Familia:
      type: object
      properties:
        idFamilia: { type: integer, readOnly: true }
        nombre: { type: string }
        codigoInvitacion: { type: string }

    Tarea:
      type: object
      properties:
        idTarea: { type: integer, readOnly: true }
        titulo: { type: string }
        descripcion: { type: string }
        fechaLimite: { type: string, format: date }
        puntos: { type: integer }
        tipo: { $ref: '#/components/schemas/TipoTarea' }
        estado: { $ref: '#/components/schemas/EstadoTarea' }
        evidencia: { type: string }

    # Desafio hereda de Tarea
    Desafio:
      allOf:
        - $ref: '#/components/schemas/Tarea'
        - type: object
          properties:
            periodicidad: { type: string }
            puntosBonus: { type: integer }
            fechaInicio: { type: string, format: date }
            fechaFin: { type: string, format: date }

    TipoTarea:
      type: string
      enum: [HOGAR, EDUCATIVA]

    EstadoTarea:
      type: string
      enum: [PENDIENTE, EN_REVISION, APROBADA, RECHAZADA, VENCIDA]


    Recompensa:
      type: object
      properties:
        idRecompensa: { type: integer, readOnly: true }
        nombre: { type: string }
        descripcion: { type: string }
        costoPuntos: { type: integer }
        disponible: { type: boolean }

    Canje:
      type: object
      properties:
        idCanje: { type: integer, readOnly: true }
        fechaCanje: { type: string, format: date }
        puntosGastados: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoCanje' }
        # Relación "corresponde a" del diagrama: la recompensa que se canjeó
        recompensa: { $ref: '#/components/schemas/Recompensa' }

    EstadoCanje:
      type: string
      enum: [PENDIENTE_ENTREGA, ENTREGADO]


    Nivel:
      type: object
      properties:
        numero: { type: integer }
        nombre: { type: string }
        puntosRequeridos: { type: integer }

    Insignia:
      type: object
      properties:
        idInsignia: { type: integer, readOnly: true }
        nombre: { type: string }
        descripcion: { type: string }
        icono: { type: string }
        criterio: { type: string }

    # Relaciona a un Hijo con la Insignia que ganó
    InsigniaObtenida:
      type: object
      properties:
        insignia: { $ref: '#/components/schemas/Insignia' }
        fechaObtencion: { type: string, format: date }

    Avatar:
      type: object
      properties:
        idAvatar: { type: integer, readOnly: true }
        imagenBase: { type: string }
        color: { type: string }
        accesorios:
          type: array
          items: { type: string }

    Minijuego:
      type: object
      properties:
        idMinijuego: { type: integer, readOnly: true }
        nombre: { type: string }
        categoria: { type: string }
        edadMinima: { type: integer }
        edadMaxima: { type: integer }
        puntosBonus: { type: integer }

    PartidaMinijuego:
      type: object
      properties:
        fecha: { type: string, format: date }
        puntaje: { type: integer }
        bonificacion: { type: integer }
# FamQuest API

openapi: 3.0.3
info:
  title: FamQuest API
  version: 1.0.0
  description: |
    API REST de FamQuest: los padres asignan tareas y los hijos ganan puntos por completarlas y asi canjear recompensas establecidas por los padres.
    Flujo de tareas: pendientes cuando se crean, el hijo la completa y pasa a revisión, el padre la aprueba o la rechaza y despues se acuerdan las recompensas.

servers:
  - url: http://localhost:3000/famquest/v1

tags:
  - name: Sesión
  - name: Padres
  - name: Familias
  - name: Hijos
  - name: Tareas
  - name: Desafíos
  - name: Niveles
  - name: Insignias
  - name: Avatar
  - name: Minijuegos
  - name: Progreso

paths:
  # Sesiones
  /sesiones:
    post:
      tags: [Sesión]
      summary: Iniciar sesión (padre o hijo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo: { type: string }
                contrasena: { type: string }
      responses:
        '200':
          description: Inicio de sesion exitoso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401':
          description: Correo o contraseña incorrectos

  # Padres
  /padres:
    post:
      tags: [Padres]
      summary: Registrar un padre
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Padre' }
      responses:
        '201':
          description: Padre registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Padre' }
        '400':
          description: Datos invalidos

  /padres/{idPadre}:
    parameters:
      - $ref: '#/components/parameters/IdPadre'
    get:
      tags: [Padres]
      summary: Ver el perfil de un padre
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Padre' }
        '404':
          description: Padre no encontrado
    put:
      tags: [Padres]
      summary: Actualizar el perfil de un padre
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Padre' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Padre' }
        '404':
          description: Padre no encontrado

  # Familias
  /familias:
    post:
      tags: [Familias]
      summary: Crear una familia
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Familia' }
      responses:
        '201':
          description: Familia creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Familia' }

  /familias/{idFamilia}:
    get:
      tags: [Familias]
      summary: Ver una familia
      parameters:
        - $ref: '#/components/parameters/IdFamilia'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Familia' }
        '404':
          description: Familia no encontrada

  /familias/{idFamilia}/miembros:
    post:
      tags: [Familias]
      summary: Agregar un miembro a la familia
      parameters:
        - $ref: '#/components/parameters/IdFamilia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idUsuario: { type: integer, example: 4 }
      responses:
        '201':
          description: Miembro agregado
        '404':
          description: Familia o usuario no encontrado

  /familias/{idFamilia}/miembros/{idUsuario}:
    delete:
      tags: [Familias]
      summary: Eliminar un miembro de la familia
      parameters:
        - $ref: '#/components/parameters/IdFamilia'
        - $ref: '#/components/parameters/IdUsuario'
      responses:
        '204':
          description: Miembro eliminado
        '404':
          description: Familia o usuario no encontrado

  # Hijos
  /familias/{idFamilia}/hijos:
    parameters:
      - $ref: '#/components/parameters/IdFamilia'
    post:
      tags: [Hijos]
      summary: Crear el perfil de un hijo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Hijo' }
      responses:
        '201':
          description: Perfil creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hijo' }
        '400':
          description: Datos inválidos
    get:
      tags: [Hijos]
      summary: Listar los hijos de una familia
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Hijo' }

  /hijos/{idHijo}:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Hijos]
      summary: Ver el perfil de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hijo' }
        '404':
          description: Hijo no encontrado
    put:
      tags: [Hijos]
      summary: Editar el perfil de un hijo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Hijo' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hijo' }
        '404':
          description: Hijo no encontrado
    delete:
      tags: [Hijos]
      summary: Eliminar el perfil de un hijo
      responses:
        '204':
          description: Perfil eliminado
        '404':
          description: Hijo no encontrado

  #Tareas
  /hijos/{idHijo}/tareas:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    post:
      tags: [Tareas]
      summary: Asignar una tarea a un hijo
      description: La tarea se crea como pendiente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tarea' }
      responses:
        '201':
          description: Tarea asignada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarea' }
        '400':
          description: Datos invalidos
    get:
      tags: [Tareas]
      summary: Ver las tareas de un hijo
      parameters:
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoTarea' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tarea' }

  /tareas/{idTarea}:
    parameters:
      - $ref: '#/components/parameters/IdTarea'
    get:
      tags: [Tareas]
      summary: Ver una tarea
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarea' }
        '404':
          description: Tarea no encontrada
    put:
      tags: [Tareas]
      summary: Editar una tarea
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tarea' }
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarea' }
        '404':
          description: Tarea no encontrada
    patch:
      tags: [Tareas]
      summary: Cambiar el estado de una tarea (completada, aprobada o rechazada)
      description: |
        - El hijo la complet, pasa a revision con evidencia.
        - El padre la aprueba se le suman  puntos al hijo.
        - El padre la rechaza y coloca comentario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { $ref: '#/components/schemas/EstadoTarea' }
                evidencia: { type: string }
                comentario: { type: string }
            examples:
              completar:
                summary: El hijo la completa
                value: { estado: EN_REVISION, evidencia: foto-platos.jpg }
              aprobar:
                summary: El padre la aprueba
                value: { estado: APROBADA }
              rechazar:
                summary: El padre la rechaza
                value: { estado: RECHAZADA, comentario: Falto secar vasos }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarea' }
        '404':
          description: Tarea no encontrada
    delete:
      tags: [Tareas]
      summary: Eliminar una tarea
      responses:
        '204':
          description: Tarea eliminada
        '404':
          description: Tarea no encontrada

  #Desafios
  /hijos/{idHijo}/desafios:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    post:
      tags: [Desafíos]
      summary: Crear un desafio para un hijo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Desafio' }
      responses:
        '201':
          description: Desafío creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Desafio' }
        '400':
          description: Datos invalidos
    get:
      tags: [Desafíos]
      summary: Ver los desafios de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Desafio' }

  /desafios/{idDesafio}:
    get:
      tags: [Desafíos]
      summary: Ver un desafío
      parameters:
        - $ref: '#/components/parameters/IdDesafio'           
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Desafio' }
        '404':
          description: Desafio no encontrado


  # Recompensas
  /recompensas:
    post:
      tags: [Recompensas]
      summary: Crear una recompensa
      description: El padre crea una recompensa para sus hijos.
      operationId: crearRecompensa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecompensaInput'
      responses:
        '201':
          description: Recompensa creada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recompensa'
        '400':
          description: Datos inválidos.

    get:
      tags: [Recompensas]
      summary: Listar recompensas disponibles
      description: Permite consultar las recompensas disponibles.
      operationId: listarRecompensas
      responses:
        '200':
          description: Lista de recompensas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recompensa'

  /recompensas/{idRecompensa}:
    parameters:
      - name: idRecompensa
        in: path
        required: true
        description: Identificador de la recompensa.
        schema:
          type: integer
          example: 1
    get:
      tags: [Recompensas]
      summary: Consultar una recompensa
      operationId: obtenerRecompensa
      responses:
        '200':
          description: Recompensa encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recompensa'
        '404':
          description: Recompensa no encontrada.

    put:
      tags: [Recompensas]
      summary: Actualizar una recompensa
      operationId: actualizarRecompensa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecompensaInput'
      responses:
        '200':
          description: Recompensa actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recompensa'
        '400':
          description: Datos inválidos.
        '404':
          description: Recompensa no encontrada.

    delete:
      tags: [Recompensas]
      summary: Eliminar una recompensa
      operationId: eliminarRecompensa
      responses:
        '204':
          description: Recompensa eliminada correctamente.
        '404':
          description: Recompensa no encontrada.

  /recompensas/{idRecompensa}/activar:
    patch:
      tags: [Recompensas]
      summary: Activar una recompensa
      operationId: activarRecompensa
      parameters:
        - name: idRecompensa
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Recompensa activada.
        '404':
          description: Recompensa no encontrada.

  /recompensas/{idRecompensa}/desactivar:
    patch:
      tags: [Recompensas]
      summary: Desactivar una recompensa
      operationId: desactivarRecompensa
      parameters:
        - name: idRecompensa
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Recompensa desactivada.
        '404':
          description: Recompensa no encontrada.

  # Canjes
  /canjes:
    post:
      tags: [Canjes]
      summary: Canjear una recompensa
      description: El hijo canjea una recompensa y se descuentan los puntos necesarios.
      operationId: crearCanje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idRecompensa
              properties:
                idRecompensa:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Canje realizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Canje'
        '400':
          description: La recompensa no está disponible.
        '404':
          description: Recompensa no encontrada.
        '409':
          description: El hijo no tiene suficientes puntos.

    get:
      tags: [Canjes]
      summary: Consultar historial de canjes
      operationId: listarCanjes
      parameters:
        - name: idHijo
          in: query
          required: false
          description: Filtrar canjes por hijo.
          schema:
            type: integer
        - name: estado
          in: query
          required: false
          description: Filtrar canjes por estado.
          schema:
            $ref: '#/components/schemas/EstadoCanje'
      responses:
        '200':
          description: Historial de canjes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Canje'

  /canjes/{idCanje}/confirmar-entrega:
    patch:
      tags: [Canjes]
      summary: Confirmar entrega de recompensa
      description: El padre confirma que entregó la recompensa al hijo.
      operationId: confirmarEntregaCanje
      parameters:
        - name: idCanje
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Entrega confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Canje'
        '404':
          description: Canje no encontrado.
        '409':
          description: El canje ya fue entregado.

  # Notificaciones
  /notificaciones:
    get:
      tags: [Notificaciones]
      summary: Consultar notificaciones
      description: Consultar alertas relacionadas con tareas y recompensas.
      operationId: listarNotificaciones
      responses:
        '200':
          description: Lista de notificaciones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notificacion'

  /notificaciones/{idNotificacion}/leida:
    patch:
      tags: [Notificaciones]
      summary: Marcar una notificación como leída
      operationId: marcarNotificacionLeida
      parameters:
        - name: idNotificacion
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Notificación marcada como leída.
        '404':
          description: Notificación no encontrada.


  # Niveles
  /niveles:
    get:
      tags: [Niveles]
      summary: Lista de niveles y puntos requeridos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Nivel' }

  # Insignias
  /insignias:
    get:
      tags: [Insignias]
      summary: Catálogo de insignias
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Insignia' }

  /hijos/{idHijo}/insignias:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Insignias]
      summary: Insignias obtenidas por un hijo, con su fecha
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InsigniaObtenida' }
        '404':
          description: Hijo no encontrado

  # Avatar
  /hijos/{idHijo}/avatar:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Avatar]
      summary: Ver el avatar de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avatar' }
        '404':
          description: Hijo no encontrado
    put:
      tags: [Avatar]
      summary: Personalizar el avatar de un hijo (color y accesorios)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Avatar' }
      responses:
        '200':
          description: Avatar actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avatar' }
        '400':
          description: Datos inválidos
        '404':
          description: Hijo no encontrado

  # Minijuegos
  /minijuegos:
    get:
      tags: [Minijuegos]
      summary: Listar minijuegos según la edad
      parameters:
        - name: edad
          in: query
          required: false
          description: Edad del hijo; devuelve solo los minijuegos adecuados para esa edad
          schema: { type: integer, minimum: 1, example: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Minijuego' }
        '400':
          description: Edad inválida

  /minijuegos/{idMinijuego}:
    parameters:
      - $ref: '#/components/parameters/IdMinijuego'
    get:
      tags: [Minijuegos]
      summary: Detalle de un minijuego
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Minijuego' }
        '404':
          description: Minijuego no encontrado

  /minijuegos/{idMinijuego}/partidas:
    parameters:
      - $ref: '#/components/parameters/IdMinijuego'
    post:
      tags: [Minijuegos]
      summary: Registrar el resultado de una partida; devuelve la bonificación
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartidaNueva' }
      responses:
        '201':
          description: Partida registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partida' }
        '400':
          description: Datos inválidos
        '404':
          description: Minijuego o hijo no encontrado

  /hijos/{idHijo}/partidas:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Minijuegos]
      summary: Historial de partidas de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Partida' }
        '404':
          description: Hijo no encontrado

  # Progreso
  /hijos/{idHijo}/progreso:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Progreso]
      summary: Panel del padre con puntos, nivel, tareas e insignias de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progreso' }
        '404':
          description: Hijo no encontrado

components:
  parameters:
    IdUsuario:
      name: idUsuario
      in: path
      required: true
      schema: { type: integer }
    IdPadre:
      name: idPadre
      in: path
      required: true
      schema: { type: integer }
    IdFamilia:
      name: idFamilia
      in: path
      required: true
      schema: { type: integer }
    IdHijo:
      name: idHijo
      in: path
      required: true
      schema: { type: integer }
    IdTarea:
      name: idTarea
      in: path
      required: true
      schema: { type: integer }
    IdDesafio:
      name: idDesafio
      in: path
      required: true
      schema: { type: integer }
    IdMinijuego:
      name: idMinijuego
      in: path
      required: true
      schema: { type: integer }

  schemas:
    # padre e hijo heredan de Usuario
    Usuario:
      type: object
      properties:
        idUsuario: { type: integer, readOnly: true }
        nombre: { type: string }
        correo: { type: string }
        contrasena: { type: string, writeOnly: true }
        fechaRegistro: { type: string, format: date, readOnly: true }

    Padre:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            telefono: { type: string }

    Hijo:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            fechaNacimiento: { type: string, format: date }
            puntosActuales: { type: integer }
            experiencia: { type: integer }

    Familia:
      type: object
      properties:
        idFamilia: { type: integer, readOnly: true }
        nombre: { type: string }
        codigoInvitacion: { type: string }

    Tarea:
      type: object
      properties:
        idTarea: { type: integer, readOnly: true }
        titulo: { type: string}
        descripcion: { type: string }
        fechaLimite: { type: string, format: date }
        puntos: { type: integer }
        tipo: { $ref: '#/components/schemas/TipoTarea' }
        estado: { $ref: '#/components/schemas/EstadoTarea' }
        evidencia: { type: string }

    # Desafio hereda de Tarea
    Desafio:
      allOf:
        - $ref: '#/components/schemas/Tarea'
        - type: object
          properties:
            periodicidad: { type: string }
            puntosBonus: { type: integer }
            fechaInicio: { type: string, format: date }
            fechaFin: { type: string, format: date }

    TipoTarea:
      type: string
      enum: [HOGAR, EDUCATIVA]

    EstadoTarea:
      type: string
      enum: [PENDIENTE, EN_REVISION, APROBADA, RECHAZADA, VENCIDA]

    # ---- Parte 3 ----
    Nivel:
      type: object
      properties:
        idNivel: { type: integer, readOnly: true, example: 2 }
        nombre: { type: string, example: Aprendiz }
        puntosRequeridos: { type: integer, example: 100 }

    Insignia:
      type: object
      properties:
        idInsignia: { type: integer, readOnly: true, example: 1 }
        nombre: { type: string, example: Primera tarea }
        descripcion: { type: string, example: Se obtiene al completar la primera tarea }
        icono: { type: string, example: estrella.png }

    InsigniaObtenida:
      type: object
      properties:
        insignia: { $ref: '#/components/schemas/Insignia' }
        fechaObtencion: { type: string, format: date, example: '2026-11-20' }

    Avatar:
      type: object
      properties:
        color: { type: string, example: azul }
        accesorios:
          type: array
          items: { type: string }
          example: [gorra, lentes]

    Minijuego:
      type: object
      properties:
        idMinijuego: { type: integer, readOnly: true, example: 1 }
        nombre: { type: string, example: Memoria de colores }
        descripcion: { type: string }
        edadMinima: { type: integer, example: 5 }
        edadMaxima: { type: integer, example: 10 }
        bonificacionMaxima: { type: integer, example: 20 }

    PartidaNueva:
      type: object
      required: [idHijo, puntaje]
      properties:
        idHijo: { type: integer, example: 3 }
        puntaje: { type: integer, example: 85 }
        duracionSegundos: { type: integer, example: 120 }

    Partida:
      type: object
      properties:
        idPartida: { type: integer, readOnly: true }
        idMinijuego: { type: integer }
        idHijo: { type: integer }
        puntaje: { type: integer }
        bonificacion: { type: integer, description: Puntos extra otorgados al hijo por la partida, example: 10 }
        fecha: { type: string, format: date-time, readOnly: true }

    Progreso:
      type: object
      properties:
        idHijo: { type: integer }
        puntosActuales: { type: integer }
        nivel: { $ref: '#/components/schemas/Nivel' }
        tareas:
          type: object
          properties:
            pendientes: { type: integer }
            enRevision: { type: integer }
            aprobadas: { type: integer }
            rechazadas: { type: integer }
        insignias:
          type: array
          items: { $ref: '#/components/schemas/InsigniaObtenida' }


    Recompensa:
      type: object
      properties:
        idRecompensa:
          type: integer
          readOnly: true
          example: 1
        nombre:
          type: string
          example: Una salida al cine
        descripcion:
          type: string
          example: Salida al cine el fin de semana
        costoPuntos:
          type: integer
          example: 100
        activa:
          type: boolean
          example: true
        idPadre:
          type: integer
          example: 1

    RecompensaInput:
      type: object
      required:
        - nombre
        - descripcion
        - costoPuntos
      properties:
        nombre:
          type: string
          example: Una salida al cine
        descripcion:
          type: string
          example: Salida al cine el fin de semana
        costoPuntos:
          type: integer
          minimum: 1
          example: 100

    Canje:
      type: object
      properties:
        idCanje:
          type: integer
          readOnly: true
          example: 1
        idHijo:
          type: integer
          example: 2
        idRecompensa:
          type: integer
          example: 1
        fechaCanje:
          type: string
          format: date-time
        estado:
          $ref: '#/components/schemas/EstadoCanje'

    EstadoCanje:
      type: string
      enum:
        - PENDIENTE_ENTREGA
        - ENTREGADO
      example: PENDIENTE_ENTREGA

    Notificacion:
      type: object
      properties:
        idNotificacion:
          type: integer
          readOnly: true
          example: 1
        idUsuario:
          type: integer
          example: 2
        mensaje:
          type: string
          example: Has conseguido una nueva recompensa
        tipo:
          type: string
          enum:
            - TAREA
            - RECOMPENSA
          example: RECOMPENSA
        fecha:
          type: string
          format: date-time
        leida:
          type: boolean
          example: false

# FamQuest API

openapi: 3.0.3
info:
  title: FamQuest API
  version: 1.0.0
  description: |
    API REST de FamQuest: los padres asignan tareas y los hijos ganan puntos por completarlas y asi canjear recompensas establecidas por los padres.
    Flujo de tareas: pendientes cuando se crean, el hijo la completa y pasa a revisión, el padre la aprueba o la rechaza y despues se acuerdan las recompensas.

servers:
  - url: http://localhost:3000/famquest/v1

tags:
  - name: Sesión
  - name: Padres
  - name: Familias
  - name: Hijos
  - name: Tareas
  - name: Desafíos
  - name: Niveles
  - name: Insignias
  - name: Avatar
  - name: Minijuegos
  - name: Progreso

paths:
  # Sesiones
  /sesiones:
    post:
      tags: [Sesión]
      summary: Iniciar sesión (padre o hijo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo: { type: string }
                contrasena: { type: string }
      responses:
        '200':
          description: Inicio de sesion exitoso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401':
          description: Correo o contraseña incorrectos

  # Padres
  /padres:
    post:
      tags: [Padres]
      summary: Registrar un padre
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Padre' }
      responses:
        '201':
          description: Padre registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Padre' }
        '400':
          description: Datos invalidos

  /padres/{idPadre}:
    parameters:
      - $ref: '#/components/parameters/IdPadre'
    get:
      tags: [Padres]
      summary: Ver el perfil de un padre
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Padre' }
        '404':
          description: Padre no encontrado
    put:
      tags: [Padres]
      summary: Actualizar el perfil de un padre
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Padre' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Padre' }
        '404':
          description: Padre no encontrado

  # Familias
  /familias:
    post:
      tags: [Familias]
      summary: Crear una familia
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Familia' }
      responses:
        '201':
          description: Familia creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Familia' }

  /familias/{idFamilia}:
    get:
      tags: [Familias]
      summary: Ver una familia
      parameters:
        - $ref: '#/components/parameters/IdFamilia'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Familia' }
        '404':
          description: Familia no encontrada

  /familias/{idFamilia}/miembros:
    post:
      tags: [Familias]
      summary: Agregar un miembro a la familia
      parameters:
        - $ref: '#/components/parameters/IdFamilia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idUsuario: { type: integer, example: 4 }
      responses:
        '201':
          description: Miembro agregado
        '404':
          description: Familia o usuario no encontrado

  /familias/{idFamilia}/miembros/{idUsuario}:
    delete:
      tags: [Familias]
      summary: Eliminar un miembro de la familia
      parameters:
        - $ref: '#/components/parameters/IdFamilia'
        - $ref: '#/components/parameters/IdUsuario'
      responses:
        '204':
          description: Miembro eliminado
        '404':
          description: Familia o usuario no encontrado

  # Hijos
  /familias/{idFamilia}/hijos:
    parameters:
      - $ref: '#/components/parameters/IdFamilia'
    post:
      tags: [Hijos]
      summary: Crear el perfil de un hijo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Hijo' }
      responses:
        '201':
          description: Perfil creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hijo' }
        '400':
          description: Datos inválidos
    get:
      tags: [Hijos]
      summary: Listar los hijos de una familia
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Hijo' }

  /hijos/{idHijo}:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Hijos]
      summary: Ver el perfil de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hijo' }
        '404':
          description: Hijo no encontrado
    put:
      tags: [Hijos]
      summary: Editar el perfil de un hijo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Hijo' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hijo' }
        '404':
          description: Hijo no encontrado
    delete:
      tags: [Hijos]
      summary: Eliminar el perfil de un hijo
      responses:
        '204':
          description: Perfil eliminado
        '404':
          description: Hijo no encontrado

  # ==========================================================
  # PARTE 3: Niveles, Insignias, Avatar, Minijuegos y Progreso
  # ==========================================================

  # Niveles
  /niveles:
    get:
      tags: [Niveles]
      summary: Lista de niveles y puntos requeridos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Nivel' }

  # Insignias
  /insignias:
    get:
      tags: [Insignias]
      summary: Catálogo de insignias
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Insignia' }

  /hijos/{idHijo}/insignias:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Insignias]
      summary: Insignias obtenidas por un hijo, con su fecha
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InsigniaObtenida' }
        '404':
          description: Hijo no encontrado

  # Avatar
  /hijos/{idHijo}/avatar:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Avatar]
      summary: Ver el avatar de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avatar' }
        '404':
          description: Hijo no encontrado
    put:
      tags: [Avatar]
      summary: Personalizar el avatar de un hijo (color y accesorios)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Avatar' }
      responses:
        '200':
          description: Avatar actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avatar' }
        '400':
          description: Datos inválidos
        '404':
          description: Hijo no encontrado

  # Minijuegos
  /minijuegos:
    get:
      tags: [Minijuegos]
      summary: Listar minijuegos según la edad
      parameters:
        - name: edad
          in: query
          required: false
          description: Edad del hijo; devuelve solo los minijuegos adecuados para esa edad
          schema: { type: integer, minimum: 1, example: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Minijuego' }
        '400':
          description: Edad inválida

  /minijuegos/{idMinijuego}:
    parameters:
      - $ref: '#/components/parameters/IdMinijuego'
    get:
      tags: [Minijuegos]
      summary: Detalle de un minijuego
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Minijuego' }
        '404':
          description: Minijuego no encontrado

  /minijuegos/{idMinijuego}/partidas:
    parameters:
      - $ref: '#/components/parameters/IdMinijuego'
    post:
      tags: [Minijuegos]
      summary: Registrar el resultado de una partida; devuelve la bonificación
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartidaNueva' }
      responses:
        '201':
          description: Partida registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partida' }
        '400':
          description: Datos inválidos
        '404':
          description: Minijuego o hijo no encontrado

  /hijos/{idHijo}/partidas:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Minijuegos]
      summary: Historial de partidas de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Partida' }
        '404':
          description: Hijo no encontrado

  # Progreso
  /hijos/{idHijo}/progreso:
    parameters:
      - $ref: '#/components/parameters/IdHijo'
    get:
      tags: [Progreso]
      summary: Panel del padre con puntos, nivel, tareas e insignias de un hijo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progreso' }
        '404':
          description: Hijo no encontrado

components:
  parameters:
    IdUsuario:
      name: idUsuario
      in: path
      required: true
      schema: { type: integer }
    IdPadre:
      name: idPadre
      in: path
      required: true
      schema: { type: integer }
    IdFamilia:
      name: idFamilia
      in: path
      required: true
      schema: { type: integer }
    IdHijo:
      name: idHijo
      in: path
      required: true
      schema: { type: integer }
    IdTarea:
      name: idTarea
      in: path
      required: true
      schema: { type: integer }
    IdDesafio:
      name: idDesafio
      in: path
      required: true
      schema: { type: integer }
    IdMinijuego:
      name: idMinijuego
      in: path
      required: true
      schema: { type: integer }

  schemas:
    # padre e hijo heredan de Usuario
    Usuario:
      type: object
      properties:
        idUsuario: { type: integer, readOnly: true }
        nombre: { type: string }
        correo: { type: string }
        contrasena: { type: string, writeOnly: true }
        fechaRegistro: { type: string, format: date, readOnly: true }

    Padre:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            telefono: { type: string }

    Hijo:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            fechaNacimiento: { type: string, format: date }
            puntosActuales: { type: integer }
            experiencia: { type: integer }

    Familia:
      type: object
      properties:
        idFamilia: { type: integer, readOnly: true }
        nombre: { type: string }
        codigoInvitacion: { type: string }

    Tarea:
      type: object
      properties:
        idTarea: { type: integer, readOnly: true }
        titulo: { type: string}
        descripcion: { type: string }
        fechaLimite: { type: string, format: date }
        puntos: { type: integer, example: 20 }
        tipo: { $ref: '#/components/schemas/TipoTarea' }
        estado: { $ref: '#/components/schemas/EstadoTarea' }
        evidencia: { type: string, example: foto-platos.jpg }

    # Desafio hereda de Tarea
    Desafio:
      allOf:
        - $ref: '#/components/schemas/Tarea'
        - type: object
          properties:
            periodicidad: { type: string }
            puntosBonus: { type: integer }
            fechaInicio: { type: string, format: date }
            fechaFin: { type: string, format: date }

    TipoTarea:
      type: string
      enum: [HOGAR, EDUCATIVA]

    EstadoTarea:
      type: string
      enum: [PENDIENTE, EN_REVISION, APROBADA, RECHAZADA, VENCIDA]

    # ---- Parte 3 ----
    Nivel:
      type: object
      properties:
        idNivel: { type: integer, readOnly: true, example: 2 }
        nombre: { type: string, example: Aprendiz }
        puntosRequeridos: { type: integer, example: 100 }

    Insignia:
      type: object
      properties:
        idInsignia: { type: integer, readOnly: true, example: 1 }
        nombre: { type: string, example: Primera tarea }
        descripcion: { type: string, example: Se obtiene al completar la primera tarea }
        icono: { type: string, example: estrella.png }

    InsigniaObtenida:
      type: object
      properties:
        insignia: { $ref: '#/components/schemas/Insignia' }
        fechaObtencion: { type: string, format: date, example: '2026-11-20' }

    Avatar:
      type: object
      properties:
        color: { type: string, example: azul }
        accesorios:
          type: array
          items: { type: string }
          example: [gorra, lentes]

    Minijuego:
      type: object
      properties:
        idMinijuego: { type: integer, readOnly: true, example: 1 }
        nombre: { type: string, example: Memoria de colores }
        descripcion: { type: string }
        edadMinima: { type: integer, example: 5 }
        edadMaxima: { type: integer, example: 10 }
        bonificacionMaxima: { type: integer, example: 20 }

    PartidaNueva:
      type: object
      required: [idHijo, puntaje]
      properties:
        idHijo: { type: integer, example: 3 }
        puntaje: { type: integer, example: 85 }
        duracionSegundos: { type: integer, example: 120 }

    Partida:
      type: object
      properties:
        idPartida: { type: integer, readOnly: true }
        idMinijuego: { type: integer }
        idHijo: { type: integer }
        puntaje: { type: integer }
        bonificacion: { type: integer, description: Puntos extra otorgados al hijo por la partida, example: 10 }
        fecha: { type: string, format: date-time, readOnly: true }

    Progreso:
      type: object
      properties:
        idHijo: { type: integer }
        puntosActuales: { type: integer }
        nivel: { $ref: '#/components/schemas/Nivel' }
        tareas:
          type: object
          properties:
            pendientes: { type: integer }
            enRevision: { type: integer }
            aprobadas: { type: integer }
            rechazadas: { type: integer }
        insignias:
          type: array
          items: { $ref: '#/components/schemas/InsigniaObtenida' }
